<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC1 夜班值班員</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Chakra+Petch:wght@500;700&display=swap">
<style>
    /* 夜班冷鏈物流中心：深色場景、冰藍冷庫、橘色為任務與 AC1；單一深色主題 */
    :root {
        color-scheme: dark;
        --bg: #0c141c;
        --panel: #132230;
        --panel-2: #1a2e40;
        --line: #2a4258;
        --fg: #e6eef5;
        --muted: #8fa4b6;
        --accent: #f0901f;
        --accent-ink: #1a0f02;
        --run: #35b56f;
        --defrost: #4a97f0;
        --fault: #ef5a5a;
        --warn: #f2c14e;
        --font-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
        --font-num: "Chakra Petch", "Noto Sans TC", monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.5; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }

    .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 6px 16px; margin-bottom: 10px; }
    .top h1 { margin: 0; font-size: 1.45rem; font-weight: 900; text-wrap: balance; }
    .top h1 span { color: var(--accent); }
    .top .sub { color: var(--muted); font-size: 0.85rem; }
    .night-tag { font-weight: 700; font-size: 0.85rem; padding: 3px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
    .night-tag.ac1 { border-color: var(--accent); color: var(--accent); }

    .hud { display: grid; grid-template-columns: 110px 130px minmax(0, 1fr); gap: 8px; margin-bottom: 8px; }
    .hud .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; min-width: 0; }
    .hud .k { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.05em; }
    .hud .v { font: 700 1.25rem var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .hud .v.bad { color: var(--fault); }
    .hud .goal { font-size: 0.95rem; font-weight: 700; color: var(--accent); }
    @media (max-width: 560px) {
        .hud { grid-template-columns: 1fr 1fr; }
        .hud .goal-cell { grid-column: 1 / -1; }
    }

    .stage { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #0a1118; }
    canvas { display: block; width: 100%; touch-action: none; outline: none; }

    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 8px; }
    .bar .keys { font-size: 0.8rem; color: var(--muted); }
    .bar .keys kbd { font-family: var(--font-num); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; background: var(--panel); color: var(--fg); }
    .bar .btns { display: flex; gap: 8px; flex-wrap: wrap; }

    button {
        font-family: var(--font-body); font-size: 0.9rem;
        padding: 8px 14px; border-radius: 6px;
        border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    /* 對話框 */
    .dialog {
        position: absolute; left: 12px; right: 12px; bottom: 12px;
        background: rgba(12, 22, 32, 0.96);
        border: 1px solid var(--line); border-top: 3px solid var(--accent);
        border-radius: 8px; padding: 12px 14px;
        max-height: 70%; overflow-y: auto;
    }
    .dialog .who { font-weight: 900; color: var(--accent); }
    .dialog .who small { color: var(--muted); font-weight: 400; margin-left: 6px; }
    .dialog .text { margin: 4px 0 10px; font-size: 1rem; }
    .dialog .choices { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .dialog .choices button { text-align: left; }
    .term {
        padding: 0 2px; font-size: inherit; border: none; border-bottom: 1px dashed var(--accent);
        border-radius: 0; background: none; color: var(--accent); cursor: help;
    }
    .gloss {
        position: absolute; left: 12px; right: 12px; top: 12px;
        background: var(--panel-2); border: 1px solid var(--accent); border-radius: 8px;
        padding: 10px 12px; font-size: 0.9rem;
    }
    .gloss b { color: var(--accent); }

    /* 開場與結算 */
    .overlay {
        position: absolute; inset: 0; background: rgba(6, 11, 16, 0.92);
        display: flex; align-items: safe center; justify-content: center; padding: 16px; overflow-y: auto;
    }
    .prompt {
        position: absolute; transform: translate(-50%, -100%);
        background: rgba(12, 22, 32, 0.9); border: 1px solid var(--line); border-radius: 4px;
        padding: 2px 8px; font-size: 0.8rem; font-weight: 700; pointer-events: none; white-space: nowrap;
    }
    .overlay[hidden], .dialog[hidden], .gloss[hidden], .prompt[hidden] { display: none; }
    .card { max-width: 560px; width: 100%; }
    .card .eyebrow { color: var(--accent); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; }
    .card h2 { margin: 4px 0 8px; font-size: 1.5rem; font-weight: 900; text-wrap: balance; }
    .card p { margin: 0 0 10px; color: var(--muted); }
    .card p b { color: var(--fg); }
    .card .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .result { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin: 6px 0; }
    .result th, .result td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
    .result th { color: var(--muted); font-weight: 400; }
    .result td.n { font-family: var(--font-num); text-align: right; font-variant-numeric: tabular-nums; }
    .result .ac1 { color: var(--accent); }
    .fine { font-size: 0.75rem; color: var(--muted); margin-top: 10px; }

    footer { color: var(--muted); font-size: 0.78rem; margin-top: 14px; }

    /* 情境選單 */
    .scenarios { display: grid; gap: 8px; margin-top: 8px; }
    .scenario {
        display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: center;
        text-align: left; padding: 10px 12px; width: 100%;
    }
    .scenario .sc-time { font: 700 0.95rem var(--font-num); color: var(--accent); }
    .scenario .sc-main { display: grid; gap: 2px; min-width: 0; }
    .scenario .sc-main b { font-size: 1rem; }
    .scenario .sc-main small { color: var(--accent); font-size: 0.75rem; }
    .scenario .sc-main span { color: var(--muted); font-size: 0.82rem; }
    .scenario .sc-done { color: var(--run); font-size: 0.78rem; white-space: nowrap; }
    @media (max-width: 480px) { .scenario { grid-template-columns: 44px minmax(0, 1fr); } .scenario .sc-done { grid-column: 2; } }
</style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <div>
            <h1>冷庫夜班：<span>哪一台？</span></h1>
            <div class="sub">北部食品冷凍物流中心・夜班設備工程師的一夜（3D）</div>
        </div>
        <div class="night-tag" id="night-tag">第一晚｜現況</div>
    </div>

    <div class="hud">
        <div class="cell"><div class="k">時間</div><div class="v" id="hud-time">02:13</div></div>
        <div class="cell"><div class="k" id="hud-temp-k">C3 庫溫</div><div class="v" id="hud-temp">-17.6°C</div></div>
        <div class="cell goal-cell"><div class="k">目標</div><div class="goal" id="hud-goal">接電話</div></div>
    </div>

    <div class="stage" id="stage">
        <div class="prompt" id="prompt" hidden></div>
        <div class="gloss" id="gloss" hidden></div>
        <div class="dialog" id="dialog" hidden></div>
        <div class="overlay" id="overlay"></div>
    </div>

    <div class="bar">
        <div class="keys">走路：<kbd>←↑↓→</kbd> / <kbd>WASD</kbd> 或點地板　對話：走近按 <kbd>E</kbd>　頭上有 <b style="color: var(--warn)">!</b> 的是下一步</div>
        <div class="btns">
            <button type="button" id="talk-btn">對話（E）</button>
            <button type="button" id="guide-btn">帶我去</button>
        </div>
    </div>

    <footer>故事依 AC1 冷鏈 GTM 討論資料的固定情境改編（8 間冷庫、32 台冷風機、每台運轉／故障／除霜 3 點）。人物、時間、溫度與數字皆為虛構示意，非實測，也不代表任何公司的實際作業規定。</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== 地圖 =====
const T = 32, W = 40, H = 22;
const grid = Array.from({ length: H }, () => Array(W).fill("#"));
function carve(x0, y0, x1, y1, ch) {
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) grid[y][x] = ch;
}
// 冷庫（上排）：C1、C2、C4 與機組為實心；C3 可進入
carve(1, 1, 7, 8, "X"); carve(9, 1, 15, 8, "X"); carve(26, 1, 32, 8, "X"); carve(34, 1, 38, 8, "X");
carve(17, 1, 24, 7, "c");
grid[8][20] = "D"; grid[8][21] = "D";
// 走道
carve(1, 9, 38, 11, ".");
// 下排房間
const ROOMS_BOTTOM = [
    { name: "中控室", x0: 1, x1: 9, door: 5, ch: "o" },
    { name: "工程辦公區", x0: 11, x1: 16, door: 13, ch: "o" },
    { name: "機房", x0: 18, x1: 24, door: 21, ch: "m" },
    { name: "品保", x0: 26, x1: 31, door: 28, ch: "o" },
    { name: "主任室", x0: 33, x1: 38, door: 35, ch: "o" }
];
ROOMS_BOTTOM.forEach(r => { carve(r.x0, 13, r.x1, 20, r.ch); grid[12][r.door] = r.ch; });

const BLOCK_LABELS = [
    { x0: 1, x1: 7, name: "C1", sub: "冷凍" }, { x0: 9, x1: 15, name: "C2", sub: "冷凍" },
    { x0: 26, x1: 32, name: "C4", sub: "冷凍" }, { x0: 34, x1: 38, name: "冷凍機組", sub: "" }
];

// ===== 物件與人物 =====
const OBJS = [
    { id: "handoff", x: 13, y: 14, kind: "desk", name: "交接本" },
    { id: "screen", x: 3, y: 13, kind: "screen", name: "監控螢幕" },
    { id: "zhe", x: 5, y: 15, kind: "npc", name: "阿哲", role: "中控值班", color: "#5aa9e6" },
    { id: "locker", x: 24, y: 9, kind: "locker", name: "防寒衣櫃" },
    { id: "fan1", x: 18, y: 1, kind: "fan", name: "C3 第 1 台冷風機", n: 1 },
    { id: "fan2", x: 24, y: 1, kind: "fan", name: "C3 第 2 台冷風機", n: 2 },
    { id: "fan3", x: 17, y: 5, kind: "fan", name: "C3 第 3 台冷風機", n: 3 },
    { id: "fan4", x: 24, y: 5, kind: "fan", name: "C3 第 4 台冷風機", n: 4 },
    { id: "pallet1", x: 20, y: 3, kind: "pallet" }, { id: "pallet2", x: 21, y: 3, kind: "pallet" },
    { id: "pallet3", x: 20, y: 4, kind: "pallet" }, { id: "pallet4", x: 21, y: 4, kind: "pallet" },
    { id: "pallet5", x: 22, y: 6, kind: "pallet" }, { id: "pallet6", x: 18, y: 3, kind: "pallet" },
    { id: "panel", x: 19, y: 13, kind: "panel", name: "配電盤" },
    { id: "chen", x: 22, y: 16, kind: "npc", name: "老陳", role: "冷凍空調工程商", color: "#e9a23b" },
    { id: "mei", x: 28, y: 16, kind: "npc", name: "小美", role: "品保", color: "#d77fb3" },
    { id: "lin", x: 36, y: 15, kind: "npc", name: "林主任", role: "營運主管", color: "#9fb86a" },
    { id: "de", x: 31, y: 10, kind: "npc", name: "阿德", role: "倉管／堆高機", color: "#7fc6b8" },
    { id: "doorbox", x: 19, y: 9, kind: "doorbox", name: "C3 庫門" },
    { id: "unitbox", x: 36, y: 9, kind: "unitbox", name: "機組控制箱" },
    { id: "pallet7", x: 18, y: 5, kind: "pallet", onlyIn: "hotspot" }
];
const objById = Object.fromEntries(OBJS.map(o => [o.id, o]));
const objAt = (tx, ty) => OBJS.find(o => o.x === tx && o.y === ty && objActive(o));

// ===== 術語 =====
const GLOSSARY = {
    "冷風機": "裝在冷庫裡的蒸發器加風扇，把冷氣吹進庫內。一間庫通常有好幾台。",
    "除霜": "冷風機盤管會結霜，要定時加熱把霜化掉。除霜時風扇停、加熱器開；正常幾分鐘就該結束。",
    "庫溫告警": "庫內溫度超過設定上限（冷凍庫例如 -18°C）時，監控平台發出的警報。只說明「這間變熱了」，不說是哪一台。",
    "AC1": "主流電子的末端通訊技術：在交流電 L／N 之外加一條獨立資料線 D，沿配電分支布設，把設備狀態接回系統。不是電力線載波，也不取代原本的控制器和平台。",
    "D 線": "AC1 的資料線，單一導體，跟著既有配電分支走，可以樹狀分支。能不能和電源同管，要由電機技師依法規判讀。",
    "配電分支": "從配電盤分出去、供電給各台設備的線路。冷風機本來就有電，AC1 讓資料跟著電的路徑走。",
    "Gateway": "把各台設備的資料彙整起來，再送到上層監控平台的轉接設備。",
    "Modbus RTU": "冷庫控制器常用的通訊協定。AC1 負責傳輸，資料格式沿用原本的協定。",
    "備品": "壞了可以馬上換上的零件。工程商很在意新規格的備品在台灣買不買得到。",
    "設備層紀錄": "每台設備什麼時候運轉、停、除霜、故障的紀錄。有了它，事後可以追溯是哪一台、從幾點開始。",
    "門位": "庫門是開還是關的感測訊號。門開著太久，熱氣會灌進庫裡、門邊結霜。",
    "堆貨擋風": "貨堆得太靠近冷風機出風口，冷風吹不出去，庫裡局部變熱。設備本身沒有壞。",
    "冷凝機組": "在機房或屋外，負責把冷庫裡的熱排出去的壓縮機和冷凝風扇。好幾間庫可能共用一組。",
    "微電表": "裝在設備電源上的小電表，可以看出電流、用電是否異常。",
    "復電": "停電或閃斷之後電力恢復。有些設備復電後要重新啟動，不一定會自己回來。"
};

// ===== 情境 =====
// 每個異常情境玩兩晚：第一晚現況（平台只有庫溫），第二晚 AC1 接入（設備狀態接回平台）
const FAN_IDS = ["fan1", "fan2", "fan3", "fan4"];
const FANS_AND = extra => FAN_IDS.concat(extra);
const ROOM_BASE = [-22, -22, -22, -22, -22, 1.5, 1.5, 1.5];

const SCENARIOS = [
    {
        id: "defrost", title: "除霜沒停", tag: "夜班異常查找", time: 2 * 60 + 13,
        summary: "C3 庫溫告警，4 台冷風機裡有一台除霜一直沒結束。",
        rooms: [2], tempLabel: "C3 庫溫", startTemp: -17.6, rise: 0.22, recover: 0.35, setpoint: -22,
        cause: "fan2", causeText: "C3 第 2 台除霜沒停", fixer: "chen", fixMin: 8,
        candidates: FAN_IDS,
        fanState: (id, fixed) => id === "fan2" && !fixed ? "defrost" : "run",
        alert: () => "C3-2 除霜逾時：已除霜 23 分鐘未結束",
        handoff: "【交接】02:00 C3 排程[[除霜]]，4 台依序，每台約 10 分鐘。照理 02:40 前全部結束。",
        phone1: ["C3 [[庫溫告警]]，-17.6°C，還在往上爬。", "我這邊只看得到庫溫，看不到是哪一台[[冷風機]]出問題。你過來看一下？"],
        zhe1: ["你看，螢幕上只有 8 間庫的庫溫。C3 一直往上爬。", "C3 有 4 台[[冷風機]]，可是平台看不到它們在運轉、故障還是[[除霜]]。"],
        found: "風扇沒在轉，盤管摸起來是溫的。[[除霜]]加熱器還開著——除霜沒停！",
        phone2: ["C3 [[庫溫告警]]，-17.6°C。", "不過平台顯示：C3 第 1、3、4 台運轉，第 2 台[[除霜]]已經 23 分鐘還沒結束，除霜逾時。"],
        zhe2: ["螢幕上 32 台冷風機都有燈號。C3-2 是藍燈，除霜 24 分鐘還沒結束。", "這些狀態是沿著[[配電分支]]的 [[D 線]]接回 [[Gateway]] 的。"],
        fix1: ["C3 第 2 台除霜沒停？八成是除霜終止感溫棒或控制器卡住，我去處理，大概 8 分鐘。", "下次早點知道是哪一台，我可以直接帶料過去，你也不用在裡面凍那麼久。"],
        fix2: ["C3 第 2 台除霜逾時，好，我直接帶除霜控制器的料過去。"],
        ac1Question: true
    },
    {
        id: "door", title: "庫門沒關好", tag: "開門入熱", time: 3 * 60 + 42,
        summary: "堆高機出庫後，C3 的快速門沒有完全關上，熱氣一直灌進去。",
        rooms: [2], tempLabel: "C3 庫溫", startTemp: -17.7, rise: 0.22, recover: 0.5, setpoint: -22,
        cause: "doorbox", causeText: "C3 庫門沒關好", fixer: "de", fixMin: 3,
        candidates: FANS_AND(["doorbox"]),

        handoff: "【交接】03:20 阿德用堆高機從 C3 出一批冷凍水餃到月台。C5 門封條有點鬆，白班會換。",
        phone1: ["C3 [[庫溫告警]]，-17.7°C，上升得很快。", "平台只有庫溫，我不知道是冷風機還是別的問題。你過來看看？"],
        zhe1: ["C3 升得特別快，一分鐘升 0.2 度多。", "平台上只有庫溫，冷風機和庫門的狀態都看不到。"],

        phone2: ["C3 [[庫溫告警]]，-17.7°C。", "平台顯示 4 台冷風機都在運轉，但 C3 [[門位]]感測顯示庫門已經開了 17 分鐘。"],
        zhe2: ["冷風機都是綠燈，C3 的[[門位]]是紅燈，開了 17 分鐘。", "應該是剛才出貨後門沒關好，不是冷風機的問題。"],
        fix1: ["我出完貨以為門有關上……快速門的感應可能沒觸發，我馬上去關。", "門封條我明天也請老陳看一下。"],
        fix2: ["門開著 17 分鐘？我剛出完貨，感應沒觸發。馬上去關！"]
    },
    {
        id: "hotspot", title: "堆貨擋住風路", tag: "偏溫熱點", time: 1 * 60 + 35,

// 受影響庫房的庫溫（示意）：告警後以固定速率上升，修好後回落
function roomTemp(t) {
    if (!S.rooms) return -22;
    const fixAt = metrics.dispatchAt !== null ? metrics.dispatchAt + S.fixMin : Infinity;
    if (t <= fixAt) return S.startTemp + S.rise * (t - S.time);
    const peak = S.startTemp + S.rise * (fixAt - S.time);
    return Math.max(S.setpoint, peak - S.recover * (t - fixAt));
}
function overTempMinutes() {
    const fixAt = metrics.dispatchAt + S.fixMin;
    const peak = roomTemp(fixAt);
    return (fixAt - S.time) + Math.max(0, (peak + 18) / S.recover);
}

function fmt(t) {
    const m = Math.floor(t);
    return `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
}

function updateHud() {
    document.getElementById("hud-time").textContent = fmt(clock);

        el.classList.toggle("bad", temp > -18);
    }
    document.getElementById("hud-goal").textContent = goalText();
}

    if (id === "mei") {

        if (N === 1) {

                    ])]

            ["mei", "這份可以直接附在異常單上，下次也查得到前因。", [["去向林主任報告", () => setStep("lin")]]]
        ]);
    }

    if (id === "lin") {
        if (step !== "lin") return say([["lin", "處理好了再跟我說。"]]);
        clock += 1;
        metrics.endAt = clock;
        const know = Math.round(metrics.knowAt - S.time);
        const over = Math.round(overTempMinutes());
        const room = S.rooms.length > 1 ? "C3、C4" : "C3";
        if (N === 1) {

                ["lin", "有沒有辦法不用每次到現場一個一個找？", [["（第一晚結束）", () => endNight()]]]
            ]);

            ["lin", `這次${know === 0 ? "接到電話當下就知道原因" : `${know} 分鐘就知道原因`}，${room} 超過 -18°C 大約 ${over} 分鐘。`],
            ["lin", "異常單也有設備層紀錄。不過備品和施工手冊補齊之前，對外先別說滿。", [["（第二晚結束）", () => endNight()]]]

// ===== 移動與尋路 =====
function solid(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= W || ty >= H) return true;
    const ch = grid[ty][tx];
    if (ch === "#" || ch === "X") return true;
    if (ch === "D") return !coat;
    return !!objAt(tx, ty);
}
const tileOf = v => Math.floor(v / T);

function collides(x, y) {
    const r = player.r;
    return [[x - r, y - r], [x + r, y - r], [x - r, y + r], [x + r, y + r]]
        .some(([px, py]) => solid(tileOf(px), tileOf(py)));
}

function moveBy(dx, dy) {
    const before = { x: player.x, y: player.y };
    if (dx && !collides(player.x + dx, player.y)) player.x += dx;
    if (dy && !collides(player.x, player.y + dy)) player.y += dy;
    const d = Math.hypot(player.x - before.x, player.y - before.y) / T;
    if (d > 0) {
        const mins = d * 0.1;           // 走 10 格約 1 分鐘
        clock += mins;
        if (grid[tileOf(player.y)][tileOf(player.x)] === "c") metrics.exposure += mins;
        return true;
    }
    return false;
}

function bfs(goals) {
    const sx = tileOf(player.x), sy = tileOf(player.y);
    const key = (x, y) => y * W + x;
    const goalSet = new Set(goals.map(([x, y]) => key(x, y)));
    const prev = new Map([[key(sx, sy), null]]);
    const q = [[sx, sy]];
    while (q.length) {
        const [x, y] = q.shift();
        if (goalSet.has(key(x, y))) {
            const path = [];
            let k = key(x, y);
            while (k !== null) { path.unshift([k % W, Math.floor(k / W)]); k = prev.get(k); }
            return path.slice(1);
        }
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nx = x + dx, ny = y + dy;
            if (!solid(nx, ny) && !prev.has(key(nx, ny))) { prev.set(key(nx, ny), key(x, y)); q.push([nx, ny]); }
        }
    }
    return null;
}

function neighborsOf(o) {
    return [[o.x + 1, o.y], [o.x - 1, o.y], [o.x, o.y + 1], [o.x, o.y - 1]].filter(([x, y]) => !solid(x, y));
}

function guide() {
    if (dialogOpen || overlayOpen) return;
    let ids = targets();
    // 現場排查習慣：先懷疑冷風機，換好防寒衣逐台查完，再查庫門或機組
    if (step === "search") {
        const fansLeft = S.candidates.filter(id => !checked[id] && objById[id].kind === "fan");
        if (fansLeft.length) ids = coat ? fansLeft : ["locker"];
    }
    if (!ids.length) return;
    let best = null;
    ids.forEach(id => {
        const p = bfs(neighborsOf(objById[id]));
        if (p && (!best || p.length < best.length)) best = p;
    });
    if (best) player.path = best;
    else if (step === "search" && !coat) say([["sys", "要先換防寒衣才能進 C3。"]]);
}

function nearest() {
    let best = null, bd = Infinity;
    OBJS.forEach(o => {
        if (o.kind === "pallet" || !objActive(o)) return;
        const d = Math.hypot(o.x * T + T / 2 - player.x, o.y * T + T / 2 - player.y);
        if (d < bd) { bd = d; best = o; }
    });
    return bd <= T * 1.6 ? best : null;
}

function tryTalk() {
    if (dialogOpen || overlayOpen) return;
    const o = nearest();
    if (o) interact(o.id);
}

function textCanvas(text, { size = 44, weight = 700, color = "#e6eef5", bg = null, pad = 14, family = "'Noto Sans TC', sans-serif" } = {}) {
    const c = document.createElement("canvas");
    const g = c.getContext("2d");
    const font = `${weight} ${size}px ${family}`;
    g.font = font;
    const lines = String(text).split("\n");
    const w = Math.ceil(Math.max(...lines.map(l => g.measureText(l).width))) + pad * 2;
    const h = Math.ceil(size * 1.3 * lines.length) + pad * 2;
    c.width = w; c.height = h;
    g.font = font;
    if (bg) {
        g.fillStyle = bg;
        const r = 12;
        g.beginPath();
        g.moveTo(r, 0); g.arcTo(w, 0, w, h, r); g.arcTo(w, h, 0, h, r); g.arcTo(0, h, 0, 0, r); g.arcTo(0, 0, w, 0, r);
        g.fill();
    }
    g.fillStyle = color;
    g.textAlign = "center";
    g.textBaseline = "middle";
    lines.forEach((l, i) => g.fillText(l, w / 2, pad + size * 1.3 * (i + 0.5)));
    return c;
}

function makeSprite(text, height, opts = {}) {
    const c = textCanvas(text, opts);
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: opts.depthTest ?? true }));
    s.scale.set(height * c.width / c.height, height, 1);
    s.renderOrder = opts.depthTest === false ? 10 : 1;
    return s;
}

function setSpriteText(sprite, text, height, opts = {}) {
    const c = textCanvas(text, opts);
    sprite.material.map.dispose();
    sprite.material.map = new THREE.CanvasTexture(c);
    sprite.material.map.encoding = THREE.sRGBEncoding;
    sprite.material.needsUpdate = true;
    sprite.scale.set(height * c.width / c.height, height, 1);
}

function floorText(text, x, z, height, color = "rgba(230,238,245,0.45)") {
    const c = textCanvas(text, { color, size: 56 });
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    const m = new THREE.Mesh(
        new THREE.PlaneGeometry(height * c.width / c.height, height),
        new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
    );
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, 0.02, z);
    scene.add(m);
}

const lin = hex => new THREE.Color(hex).convertSRGBToLinear();

function box(w, h, d, mat, x, y, z) {

}

function buildTiles() {
    const floorTypes = { ".": C.hall, "o": C.office, "m": C.machine, "c": C.cold, "D": C.cold };
    const geo = new THREE.BoxGeometry(1, 0.1, 1);
    const counts = {};
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const ch = grid[y][x];
        if (floorTypes[ch] !== undefined) counts[ch] = (counts[ch] || 0) + 1;
    }
    const dummy = new THREE.Object3D();
    Object.entries(counts).forEach(([ch, n]) => {
        const mesh = new THREE.InstancedMesh(geo, std(floorTypes[ch], ch === "c" ? { roughness: 0.4 } : {}), n);
        mesh.receiveShadow = true;
        let i = 0;
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
            if (grid[y][x] !== ch) continue;
            dummy.position.set(x + 0.5, -0.05, y + 0.5);
            dummy.updateMatrix();
            mesh.setMatrixAt(i++, dummy.matrix);
        }
        scene.add(mesh);
    });

    // 牆
    let wallCount = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (grid[y][x] === "#") wallCount++;
    const wallMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1.1, 1), std(C.wall), wallCount);
    wallMesh.castShadow = true;
    wallMesh.receiveShadow = true;
    let i = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        if (grid[y][x] !== "#") continue;
        dummy.position.set(x + 0.5, 0.55, y + 0.5);
        dummy.updateMatrix();
        wallMesh.setMatrixAt(i++, dummy.matrix);
    }
    scene.add(wallMesh);

    // C3 庫門（換上防寒衣後打開）
    doorMesh = box(2, 1.6, 0.2, std(0x8fa7b8, { metalness: 0.4, roughness: 0.4 }), 21, 0.8, 8.5);

    // 地板文字
    ROOMS_BOTTOM.forEach(r => floorText(r.name, (r.x0 + r.x1 + 1) / 2, 20.3, 0.7));
    floorText("走道／月台", 31, 10.5, 0.7);
    floorText("C3 冷凍庫", 21, 7.3, 0.7, "rgba(20,50,75,0.6)");
}

// 電纜：配電盤 → 走道 → C3 → 冷風機；L/N 黃色，第二晚多一條 D 線（藍）與資料光點
const CABLE_PATHS = [
    [[19.5, 13.3], [19.5, 11.6], [21.5, 11.6], [21.5, 1.6], [24.5, 1.6]],
    [[21.5, 1.6], [18.5, 1.6]],
    [[21.5, 5.5], [17.8, 5.5]],
    [[21.5, 5.5], [24.2, 5.5]]
];

function segMesh(a, b, r, mat, yOff) {
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), mat);
    m.position.set((a[0] + b[0]) / 2, yOff, (a[1] + b[1]) / 2);
    m.rotation.z = Math.PI / 2;
    m.rotation.y = -Math.atan2(b[1] - a[1], b[0] - a[0]);
    scene.add(m);
    return m;
}

function buildCables() {
    const yellow = std(C.cable, { roughness: 0.5 });
    const blue = new THREE.MeshStandardMaterial({ color: lin(C.dline), emissive: lin(C.dline), emissiveIntensity: 0.6 });
    dLine = new THREE.Group();
    CABLE_PATHS.forEach(p => {
        for (let i = 0; i < p.length - 1; i++) {
            segMesh(p[i], p[i + 1], 0.06, yellow, 0.07);
            const d = segMesh([p[i][0] + 0.12, p[i][1] + 0.12], [p[i + 1][0] + 0.12, p[i + 1][1] + 0.12], 0.03, blue, 0.07);
            scene.remove(d);
            dLine.add(d);
        }
    });
    scene.add(dLine);
    const pulseMat = new THREE.MeshBasicMaterial({ color: 0x9ccaff });
    for (let k = 0; k < 6; k++) {
        const s = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), pulseMat);
        s.userData.offset = k / 6;
        dLine.add(s);
        pulses.push(s);
    }
}

function pointOnMain(t) {
    const p = CABLE_PATHS[0];
    const lens = [];
    let total = 0;
    for (let i = 0; i < p.length - 1; i++) { const l = Math.hypot(p[i + 1][0] - p[i][0], p[i + 1][1] - p[i][1]); lens.push(l); total += l; }
    let d = t * total;
    for (let i = 0; i < lens.length; i++) {
        if (d <= lens[i]) {
            const f = d / lens[i];
            return [p[i][0] + (p[i + 1][0] - p[i][0]) * f + 0.12, p[i][1] + (p[i + 1][1] - p[i][1]) * f + 0.12];
        }
        d -= lens[i];
    }
    return p[p.length - 1];
}

const STATE_COLOR = { run: C.run, defrost: C.defrost, fault: C.fault, stop: 0x8a96a3 };

function resize3D() {
    const w = stage.clientWidth;
    const h = Math.round(Math.min(600, Math.max(340, w * 0.62)));

    camera.aspect = w / h;

let lastState = "";
function update3D(dt) {
    const px = player.x / T, pz = player.y / T;
    playerMesh.position.set(px, 0, pz);
    if (player.moved) {
        const target = Math.atan2(player.dir[0], player.dir[1]);
        let diff = target - playerMesh.rotation.y;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        playerMesh.rotation.y += diff * Math.min(1, dt * 12);
        playerMesh.position.y = Math.abs(Math.sin(tNow / 90)) * 0.06;
    }
    playerMesh.userData.body.material.color.copy(lin(coat ? 0xe8edf2 : C.accent));

    // 鏡頭：在角色後上方跟隨；窄螢幕拉高
    const narrow = camera.aspect < 0.9;
    const off = narrow ? new THREE.Vector3(0, 13, 8.5) : new THREE.Vector3(0, 9.5, 7.5);
    const want = new THREE.Vector3(px, 0, pz).add(off);
    camPos.lerp(want, Math.min(1, dt * 4));
    camLook.lerp(new THREE.Vector3(px, 0.6, pz - 0.8), Math.min(1, dt * 5));
    camera.position.copy(camPos);
    camera.lookAt(camLook);

    // 冷風機：運轉中的風扇轉動、狀態燈
    OBJS.filter(o => o.kind === "fan").forEach(o => {
        const p = fanParts[o.id];
        if (fanState(o.id) === "run") p.blade.rotation.z += dt * 14;
        p.light.material.color.copy(lin(fanColor3(o.id)));
    });

    // NPC 呼吸
    Object.values(npcParts).forEach((g, i) => { g.children[0].scale.y = 1 + Math.sin(tNow / 600 + i) * 0.02; });

    // 門、AC1 模組、D 線
    const ajar = S.id === "door" && !isFixed();
    doorMesh.visible = !coat;
    doorMesh.position.x = ajar ? 21.7 : 21;
    if (objGroups.pallet7) objGroups.pallet7.visible = objActive(objById.pallet7);
    if (statusLights.unitbox) statusLights.unitbox.material.color.copy(lin(S.id === "unit" && !isFixed() ? C.fault : C.run));
    if (statusLights.doorbox) statusLights.doorbox.material.color.copy(lin(ajar ? C.fault : C.run));
    ac1Module.visible = night === 2;
    dLine.visible = night === 2;
    if (night === 2) pulses.forEach(s => {
        const [x, z] = pointOnMain((tNow / 6000 + s.userData.offset) % 1);
        s.position.set(x, 0.1, z);
    });

    // 文字隨狀態更新
    const st = `${S.id}|${night}|${coat}|${metrics.dispatchAt}`;
    if (st !== lastState) {
        lastState = st;
        setSpriteText(panelLabel, night === 2 ? "配電盤＋AC1 Gateway" : "配電盤", 0.34, { bg: "rgba(12,22,32,0.75)" });
        setSpriteText(lockerLabel, coat ? "防寒衣（已穿）" : "防寒衣櫃", 0.34, { bg: "rgba(12,22,32,0.75)" });
    }
    if (Math.floor(tNow / 500) !== update3D.screenTick) { update3D.screenTick = Math.floor(tNow / 500); drawScreen(); }

    // 任務驚嘆號
    const tg = new Set(!dialogOpen && !overlayOpen ? targets() : []);
    Object.entries(markers).forEach(([id, mk]) => {
        mk.visible = tg.has(id);
        if (mk.visible) {
            const o = objById[id];
            const y = (o.kind === "fan" ? 2.4 : o.kind === "npc" ? 2.1 : o.kind === "doorbox" ? 2.4 : 2.8) + Math.sin(tNow / 250) * 0.12;
            mk.position.set(o.x + 0.5, y, o.y + 0.5);
        }
    });

    // 「E」提示（HTML，跟著角色頭上）
    const n = !dialogOpen && !overlayOpen ? nearest() : null;
    if (n) {
        const v = new THREE.Vector3(px, 2.1, pz).project(camera);
        promptEl.textContent = `E　${n.name}`;
        promptEl.style.left = `${(v.x + 1) / 2 * renderer.domElement.clientWidth}px`;
        promptEl.style.top = `${(1 - v.y) / 2 * renderer.domElement.clientHeight}px`;
        promptEl.hidden = false;
    } else {
        promptEl.hidden = true;
    }

    renderer.render(scene, camera);
}

// ===== 主迴圈 =====
let last = performance.now();
function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    tNow = now;
    player.moved = false;
    if (!dialogOpen && !overlayOpen) {
        const speed = 4.5 * T * dt;
        let dx = 0, dy = 0;
        if (keys.ArrowLeft || keys.a) dx -= 1;
        if (keys.ArrowRight || keys.d) dx += 1;
        if (keys.ArrowUp || keys.w) dy -= 1;
        if (keys.ArrowDown || keys.s) dy += 1;
        if (dx || dy) {
            player.path = [];
            const len = Math.hypot(dx, dy);
            if (moveBy(dx / len * speed, dy / len * speed)) { player.moved = true; player.dir = [dx, dy]; }
        } else if (player.path.length) {
            const [tx, ty] = player.path[0];
            const gx = tx * T + T / 2, gy = ty * T + T / 2;
            const ddx = gx - player.x, ddy = gy - player.y;
            const dist = Math.hypot(ddx, ddy);
            if (dist > 0.01) { player.moved = true; player.dir = [ddx, ddy]; }
            if (dist <= speed) { moveBy(ddx, ddy); player.path.shift(); }
            else if (!moveBy(ddx / dist * speed, ddy / dist * speed)) player.path = [];
            if (!player.path.length) {
                const n = nearest();
                if (n && targets().includes(n.id)) interact(n.id);
            }
        }
        const inside = grid[tileOf(player.y)][tileOf(player.x)] === "c";
        if (inside && !loop.inside) metrics.entries++;
        loop.inside = inside;
        updateHud();
    }
    update3D(dt);
    requestAnimationFrame(loop);
}

function showOverlay(html) {
    const o = document.getElementById("overlay");
    o.innerHTML = `<div class="card">${html}</div>`;
    o.querySelectorAll("button").forEach(btn => btn.addEventListener("pointerup", e => {
        if (e.pointerType !== "mouse" && btn.onclick) { e.preventDefault(); suppressNextClick(); const f = btn.onclick; btn.onclick = null; f(); }
    }));
    o.hidden = false;
    o.scrollTop = 0;
    overlayOpen = true;
    const b = o.querySelector("button");
    if (b && usingKeyboard) setTimeout(() => b.focus(), 0);
}
function hideOverlay() {
    document.getElementById("overlay").hidden = true;
    overlayOpen = false;

}

const DONE_KEY = "ac1-night-shift-done";
function loadDone() {

function endNight() {
    step = "done";
    const r = {
        know: Math.round(metrics.knowAt - S.time),
        dispatch: Math.round(metrics.dispatchAt - S.time),
        over: Math.round(overTempMinutes()),
        peak: roomTemp(metrics.dispatchAt + S.fixMin),
        exposure: Math.round(metrics.exposure + (night === 1 ? CHECK_MIN.fan * S.candidates.filter(id => checked[id] && objById[id].kind === "fan").length : 0)),
        checks: metrics.checks,
        wrong: metrics.wrong,
        records: night === 2 ? "有" : "無"
    };
    results[night] = r;
    if (night === 1) {
        showOverlay(`
            <div class="eyebrow">${S.title}・第一晚結束・現況</div>
            <h2>告警後 ${r.know} 分鐘，才找到原因</h2>
            <p>原因：<b>${S.causeText}</b>。你在現場檢查了 <b>${r.checks} 處</b>，在冷凍庫裡待了約 <b>${r.exposure} 分鐘</b>。最高到 <b>${r.peak.toFixed(1)}°C</b>，超過 -18°C 約 ${r.over} 分鐘。異常單上沒有設備層紀錄。</p>
            <div class="actions"><button type="button" class="primary" id="go-2">進入第二晚：有 AC1</button></div>`);
        document.getElementById("go-2").onclick = startNight2;
        return;
    }
    const a = results[1], b = results[2];
    markDone(S.id, `提早 ${Math.max(0, a.know - b.know)} 分知道原因`);
    const row = (k, x, y) => `<tr><th>${k}</th><td class="n">${x}</td><td class="n ac1">${y}</td></tr>`;
    showOverlay(`
        <div class="eyebrow">${S.title}・兩晚對照</div>
        <h2>${S.causeText}</h2>
        <table class="result">
            <tr><th></th><th style="text-align:right">第一晚・現況</th><th style="text-align:right" class="ac1">第二晚・AC1</th></tr>
            ${row("告警 → 知道原因", `${a.know} 分`, b.know === 0 ? "當下" : `${b.know} 分`)}
            ${row("告警 → 派工", `${a.dispatch} 分`, `${b.dispatch} 分`)}
            ${row("現場檢查", `${a.checks} 處`, `${b.checks} 處`)}
            ${row("待在冷凍庫內", `${a.exposure} 分`, `${b.exposure} 分`)}
            ${row("最高溫", `${a.peak.toFixed(1)}°C`, `${b.peak.toFixed(1)}°C`)}
            ${row("超過 -18°C", `約 ${a.over} 分`, `約 ${b.over} 分`)}
            ${row("找錯人", `${a.wrong} 次`, `${b.wrong} 次`)}
            ${row("設備層紀錄", a.records, b.records)}
        </table>
        <p>AC1 提供的是接入通道：狀態沿既有配電分支接回原平台，判讀與處置仍由控制器、平台和工程商負責。</p>
        <div class="actions">
            <button type="button" class="primary" id="menu">回到情境選單</button>
            <button type="button" id="again">這件再玩一次</button>
        </div>
        <div class="fine">遊戲數字為虛構示意，非實測。待補證據：約 -25°C 低溫凝露實測、冷庫控制器對接、同一配置圖的工程量比較、D 線同管的法規判讀。</div>`);
    document.getElementById("menu").onclick = showMenu;
    document.getElementById("again").onclick = () => startScenario(S);
}

function startQuiz() {
    resetNight(1);
    player.x = 30 * T + T / 2; player.y = 10 * T + T / 2;
    showOverlay(`
        <div class="eyebrow">${S.tag}・${fmt(S.time)}</div>
        <h2>${S.title}</h2>
        <p>下午沒有異常。林主任找你和老陳開會，談擴建新庫和其他據點的改善。</p>
        <p>老陳很直接：「為什麼不用 RS-485、PoE 或 Wi-Fi？」每種現場適合的方案不一樣，選對才算數。</p>
        <div class="actions"><button type="button" class="primary" id="pick-q">去主任室</button></div>`);
    document.getElementById("pick-q").onclick = () => { hideOverlay(); setStep("lin"); };
}

function endQuiz() {
    step = "done";
    const n = metrics.score, total = QUIZ.length;
    markDone(S.id, `答對 ${n}/${total}`);
    showOverlay(`
        <div class="eyebrow">${S.title}・會議結束</div>
        <h2>答對 ${n} / ${total} 題</h2>
        <p><b>AC1 有利</b>：設備沿多個配電分支分散、沒有可沿用的網路、庫板遮蔽無線、營運中要局部施工。</p>
        <p><b>AC1 不利或差異不大</b>：只需溫度且附近已有 PoE、RS-485 線很短、完全不能新增線材、跨多套變電系統。</p>
        <p>依據 GTM 討論資料的「翻轉條件」整理；PLC 對照與低溫環境仍待實測。</p>
        <div class="actions">
            <button type="button" class="primary" id="menu">回到情境選單</button>
            <button type="button" id="again">再答一次</button>
        </div>`);
    document.getElementById("menu").onclick = showMenu;
    document.getElementById("again").onclick = () => startScenario(S);
}

// ===== 輸入 =====
window.addEventListener("keydown", e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (overlayOpen) return;
    if (dialogOpen) {
        const btns = [...document.querySelectorAll("#dialog .choices button")];
        if (/^[1-9]$/.test(k) && btns[+k - 1]) { e.preventDefault(); btns[+k - 1].click(); }
        else if ((k === "e" || k === " " || k === "Enter") && btns.length === 1 && document.activeElement !== btns[0]) { e.preventDefault(); btns[0].click(); }
        return;
    }
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "w", "a", "s", "d"].includes(k)) { keys[k] = true; e.preventDefault(); }
    if (k === "e") { e.preventDefault(); tryTalk(); }
});
window.addEventListener("keyup", e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    keys[k] = false;
});
window.addEventListener("blur", () => Object.keys(keys).forEach(k => { keys[k] = false; }));

function onPointer(e) {
    if (dialogOpen || overlayOpen) return;
    const el = renderer.domElement;
    el.focus();
    const rect = el.getBoundingClientRect();
    const v = new THREE.Vector2((e.clientX - rect.left) / rect.width * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
    ray.setFromCamera(v, camera);
    const hit = ray.intersectObjects(pickables, true).find(h => h.object.userData.objId && !h.object.isSprite);
    const o = hit ? objById[hit.object.userData.objId] : null;
    if (o && o.kind !== "pallet") {
        if (nearest() === o) { interact(o.id); return; }
        const p = bfs(neighborsOf(o));
        if (p) player.path = p;
        return;
    }
    const g = ray.intersectObject(groundPlane)[0];
    if (!g) return;
    const tx = Math.floor(g.point.x), ty = Math.floor(g.point.z);
    if (!solid(tx, ty)) {
        const p = bfs([[tx, ty]]);
        if (p) player.path = p;
    }
}

document.getElementById("talk-btn").onclick = tryTalk;
document.getElementById("guide-btn").onclick = guide;
document.getElementById("gloss").onclick = e => { e.currentTarget.hidden = true; };

function boot() {
    init3D();
    renderer.domElement.addEventListener("pointerdown", onPointer);
    window.addEventListener("resize", resize3D);
    showMenu();
    requestAnimationFrame(loop);
}

if (typeof THREE === "undefined") {
    document.getElementById("overlay").innerHTML = '<div class="card"><h2>3D 場景載入失敗</h2><p>這個遊戲需要從 cdnjs 載入 three.js。請確認網路連線後重新整理頁面。</p></div>';
} else {
    const fontsReady = document.fonts ? Promise.race([
        Promise.all([document.fonts.load("700 44px 'Noto Sans TC'"), document.fonts.load("700 20px 'Chakra Petch'")]),
        new Promise(r => setTimeout(r, 2500))
    ]) : Promise.resolve();
    fontsReady.catch(() => {}).finally(boot);
}
</script>
